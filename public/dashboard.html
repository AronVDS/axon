/* ── API helper ── */
async function callOrchestrator(task) {
  const res = await fetch('/api/orchestrate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ task }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data.result;
}

function friendlyError(msg) {
  if (!msg) return 'Er is een onbekende fout opgetreden.';
  if (/ollama|connection refused|connectie/i.test(msg))
    return 'Axon kan het AI-model (Ollama) niet bereiken. Zorg dat Ollama actief is en probeer opnieuw.';
  if (/token|oauth|credential|gmail/i.test(msg))
    return 'Gmail-toegang is niet ingesteld. Configureer je Gmail-credentials om emails te kunnen lezen.';
  if (/FileNotFoundError|No such file/i.test(msg))
    return 'Een benodigde configuratiefile ontbreekt. Controleer of de installatie volledig is.';
  if (/time.?out|504/i.test(msg))
    return 'De opdracht duurde te lang (max. 2 minuten). Probeer een kortere of eenvoudigere opdracht.';
  return msg;
}

  useEffect(() => {

    return () => document.removeEventListener('mousedown', close);

  const toggle = () => {
    if (!open && !stats) fetch('/api/stats').then(r => r.json()).then(setStats).catch(() => {});
    setOpen(o => !o);

  const labels = lang === 'fr'
    ? { title:'Activité', leads:'Prospects trouvés', tasks:'Tâches suivies', docs:'Documents créés', empty:'Chargement…' }

═══════════════════════════════════════════════════ */
function Onboarding({ profile = {}, onComplete, lang = 'nl', setLang, onProfileClick }) {
  const [step, setStep] = useState(0);
  const [name, setName] = useState(profile.name || '');
  const [sector, setSector] = useState(profile.sector || 'Andere');
  const [picks, setPicks] = useState(profile.picks || { leads:true, email:true, offer:false, tasks:false });
  const [saving, setSaving] = useState(false);
  const total = 3;
  const tr = T[lang].ob;

  const handleFinish = async () => {
    if (saving) return;
    setSaving(true);
    try {
      await fetch('/api/profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, sector, picks }),
      });
      if (onComplete) onComplete({ name, sector, picks });
    } catch {
      if (onComplete) onComplete({ name, sector, picks });
    } finally {
      setSaving(false);
    }
  };

  const sectors = ['Restaurant','Bouw','Marketing','Retail','Andere'];
  const auto = lang === 'fr'
    ? [
        { k:'leads', t:'Trouver des clients', d:'Je cherche chaque semaine des clients adaptés dans votre région.', i:'🎯' },
        { k:'email', t:'Gérer les emails',    d:'Je résume votre boîte de réception et propose des réponses.',     i:'✉️' },
        { k:'offer', t:'Créer des devis',     d:'Je remplis votre modèle, calcule la TVA et prépare le PDF.',       i:'📄' },
        { k:'tasks', t:'Suivre les tâches',   d:'Je vous rappelle les délais et les dossiers en attente.',          i:'✓' },
      ]
    : [
        { k:'leads', t:'Leads vinden',   d:'Ik zoek elke week passende klanten in jouw regio.', i:'🎯' },
        { k:'email', t:'Emails beheren', d:'Ik vat je inbox samen en stel antwoorden voor.',    i:'✉️' },
        { k:'offer', t:'Offertes maken', d:'Ik vul je sjabloon in, reken btw uit, lever PDF.',   i:'📄' },
        { k:'tasks', t:'Taken opvolgen', d:'Ik herinner je aan deadlines en wachtende dossiers.',i:'✓' },
      ];
  const stepMeta = tr.steps;

  return (
    <Frame>
      <TopBar profile={{ name, sector }} lang={lang} setLang={setLang} onProfileClick={onProfileClick} />
      <div style={{ padding:'0 32px', display:'flex', alignItems:'center', gap:18 }}>
        <span style={{ fontSize:12, color:'#6b7180', fontFamily:"'JetBrains Mono',monospace", letterSpacing:'.12em', whiteSpace:'nowrap' }}>
          ONBOARDING · {String(step+1).padStart(2,'0')} / {String(total).padStart(2,'0')}
        </span>
        <div style={{ flex:1, height:6, borderRadius:999, background:'rgba(255,255,255,0.06)', overflow:'hidden', border:'1px solid rgba(255,255,255,0.04)' }}>
          <div style={{ height:'100%', width:`${((step+1)/total)*100}%`, background:`linear-gradient(90deg,#1f7a44,${GREEN})`, borderRadius:999, boxShadow:'0 0 20px rgba(74,222,128,0.5)', transition:'width .4s' }}/>
        </div>
        <span style={{ fontSize:12, color:'#a8aebb', fontWeight:600 }}>{Math.round(((step+1)/total)*100)}%</span>
      </div>

      <div style={{ padding:'40px 32px 0', display:'grid', gridTemplateColumns:'1.1fr 1fr', gap:48, alignItems:'start' }}>
        <div>
          <span style={{ display:'inline-flex', gap:8, alignItems:'center', fontSize:12, fontWeight:700, color:GREEN, letterSpacing:'.06em', padding:'6px 12px', border:'1px solid rgba(74,222,128,0.25)', borderRadius:999, background:'rgba(74,222,128,0.06)' }}>
            ● {stepMeta[step].eb}
          </span>
          <h1 style={{ fontSize:42, fontWeight:700, letterSpacing:'-0.02em', margin:'16px 0 8px', lineHeight:1.1 }}>{stepMeta[step].q}</h1>
          <p style={{ margin:0, color:'#a8aebb', fontSize:17, lineHeight:1.5, maxWidth:480 }}>{stepMeta[step].sub}</p>

          <div style={{ marginTop:32 }}>
            {step === 0 && (
              <div>
                <label style={{ display:'block', fontSize:12, color:'#6b7180', marginBottom:10, fontFamily:"'JetBrains Mono',monospace", letterSpacing:'.12em', textTransform:'uppercase' }}>Bedrijfsnaam</label>
                <div style={{ border:'1px solid rgba(74,222,128,0.4)', background:'rgba(8,9,13,0.65)', borderRadius:14, padding:'4px 4px 4px 22px', display:'flex', alignItems:'center', boxShadow:'0 0 0 4px rgba(74,222,128,0.08)' }}>
                  <input value={name} onChange={e => setName(e.target.value)} style={{ flex:1, padding:'18px 0', background:'transparent', border:'none', outline:'none', color:'#ecedf0', fontSize:22, fontWeight:600 }} />
                  <span style={{ padding:'8px 14px', fontSize:12, color:'#6b7180', fontFamily:"'JetBrains Mono',monospace" }}>{name.length}/60</span>
                </div>
                <p style={{ marginTop:14, fontSize:13.5, color:'#6b7180' }}>Tip: gewoon je gewone bedrijfsnaam — zonder BV of NV.</p>
              </div>
            )}
            {step === 1 && (
              <div>
                <label style={{ display:'block', fontSize:12, color:'#6b7180', marginBottom:10, fontFamily:"'JetBrains Mono',monospace", letterSpacing:'.12em', textTransform:'uppercase' }}>Kies je sector</label>
                <div style={{ display:'flex', flexWrap:'wrap', gap:10 }}>
                  {sectors.map(s => {
                    const on = sector === s;
                    return <button key={s} onClick={() => setSector(s)} style={{ padding:'14px 22px', borderRadius:12, fontSize:16, fontWeight:600, cursor:'pointer', border:on?'1px solid rgba(74,222,128,0.5)':'1px solid rgba(255,255,255,0.08)', background:on?'linear-gradient(180deg, rgba(74,222,128,0.16), rgba(74,222,128,0.05))':'rgba(255,255,255,0.025)', color:on?'#d6f5dd':'#a8aebb', boxShadow:on?'0 10px 24px -12px rgba(74,222,128,0.5)':'none', transition:'all .18s' }}>{s}</button>;
                  })}
                </div>
                <div style={{ marginTop:24, padding:'14px 18px', borderRadius:12, border:'1px solid rgba(255,255,255,0.06)', background:'rgba(255,255,255,0.02)', display:'flex', gap:14, alignItems:'center' }}>
                  <span style={{ fontSize:24 }}>💡</span>
                  <p style={{ margin:0, fontSize:14, color:'#a8aebb', lineHeight:1.5 }}>Voor <b style={{ color:'#ecedf0' }}>{sector}</b> stel ik vooral klanten en sjablonen voor die typisch in die wereld werken.</p>
                </div>
              </div>
            )}
            {step === 2 && (
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
                {auto.map(a => {
                  const on = picks[a.k];
                  return (
                    <button key={a.k} onClick={() => setPicks(p => ({ ...p, [a.k]:!p[a.k] }))} style={{ textAlign:'left', padding:'18px', borderRadius:14, cursor:'pointer', border:on?'1px solid rgba(74,222,128,0.5)':'1px solid rgba(255,255,255,0.08)', background:on?'linear-gradient(180deg, rgba(74,222,128,0.10), rgba(74,222,128,0.02))':'rgba(255,255,255,0.025)', display:'flex', gap:14, alignItems:'flex-start', transition:'all .18s' }}>
                      <div style={{ width:42, height:42, borderRadius:11, background:on?'rgba(74,222,128,0.18)':'rgba(255,255,255,0.04)', display:'grid', placeItems:'center', fontSize:20, color:on?GREEN:'#a8aebb', flexShrink:0, border:on?'1px solid rgba(74,222,128,0.3)':'1px solid rgba(255,255,255,0.06)' }}>{a.i}</div>
                      <div style={{ flex:1 }}>
                        <div style={{ fontSize:16, fontWeight:700, color:'#ecedf0' }}>{a.t}</div>
                        <div style={{ fontSize:13, color:'#a8aebb', marginTop:4, lineHeight:1.45 }}>{a.d}</div>
                      </div>
                      <div style={{ width:22, height:22, borderRadius:6, border:on?'1px solid '+GREEN:'1px solid rgba(255,255,255,0.18)', background:on?GREEN:'transparent', display:'grid', placeItems:'center', flexShrink:0, marginTop:2 }}>
                        {on && <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#06120a" strokeWidth="3.5"><path d="M5 12l5 5L20 7"/></svg>}
                      </div>
                    </button>
                  );
                })}
              </div>
            )}
          </div>
        </div>

        <div style={{ padding:28, borderRadius:22, ...glass }}>
          <div style={{ fontSize:11.5, color:'#6b7180', fontFamily:"'JetBrains Mono',monospace", letterSpacing:'.12em', textTransform:'uppercase', marginBottom:14 }}>Voorvertoning</div>
          <div style={{ borderRadius:14, padding:'18px 20px', background:'rgba(255,255,255,0.02)', border:'1px solid rgba(255,255,255,0.06)' }}>
            <div style={{ display:'flex', gap:12, alignItems:'flex-start' }}>
              <div style={{ width:36, height:36, borderRadius:10, background:'radial-gradient(circle at 30% 25%, rgba(74,222,128,0.5), transparent 60%), #0e1a14', border:'1px solid rgba(74,222,128,0.4)', display:'grid', placeItems:'center', color:GREEN, fontWeight:800, fontSize:13, flexShrink:0 }}>A</div>
              <div style={{ fontSize:14, color:'#ecedf0', lineHeight:1.5 }}>Hallo, ik ben <b style={{ color:GREEN }}>Axon</b>. Ik werk vanaf morgen voor <b>{name || '…'}</b>{step >= 1 && <> in de sector <b>{sector}</b></>}.</div>
            </div>
            {step >= 2 && (
              <ul style={{ margin:'14px 0 0', padding:0, listStyle:'none', display:'flex', flexDirection:'column', gap:8 }}>
                {auto.filter(a => picks[a.k]).map(a => (
                  <li key={a.k} style={{ display:'flex', gap:10, alignItems:'center', fontSize:13.5, color:'#a8aebb' }}>
                    <span style={{ width:18, height:18, borderRadius:'50%', background:'rgba(74,222,128,0.15)', display:'grid', placeItems:'center', color:GREEN, flexShrink:0 }}>
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5"><path d="M5 12l5 5L20 7"/></svg>
                    </span>
                    Ik <b style={{ color:'#ecedf0' }}>{a.t.toLowerCase()}</b>
                  </li>
                ))}
                {auto.filter(a => picks[a.k]).length === 0 && <li style={{ fontSize:13.5, color:'#6b7180' }}>Selecteer minstens één taak →</li>}
              </ul>
            )}
          </div>
          <div style={{ marginTop:18, fontSize:12, color:'#6b7180', lineHeight:1.5 }}>Je kunt later op elk moment bijstellen wat ik wel of niet doe — niets staat vast.</div>
        </div>
      </div>

      <div style={{ position:'sticky', bottom:0, padding:'20px 32px', display:'flex', justifyContent:'space-between', alignItems:'center', borderTop:'1px solid rgba(255,255,255,0.06)', background:'rgba(10,10,15,0.7)', backdropFilter:'blur(14px)', marginTop:40 }}>
        <button onClick={() => setStep(s => Math.max(0, s-1))} style={{ padding:'12px 20px', borderRadius:12, border:'1px solid rgba(255,255,255,0.1)', background:'rgba(255,255,255,0.02)', color:step===0?'#6b7180':'#a8aebb', fontWeight:600, fontSize:14, cursor:step===0?'not-allowed':'pointer' }}>{tr.back}</button>
        <span style={{ display:'flex', gap:8 }}>
          {[0,1,2].map(i => <span key={i} style={{ width:i===step?28:8, height:8, borderRadius:999, background:i<=step?GREEN:'rgba(255,255,255,0.1)', transition:'all .3s' }}/>)}
        </span>
        <button
          onClick={() => { if (step < total-1) { setStep(s => s+1); } else { handleFinish(); } }}
          disabled={saving}
          style={{ padding:'14px 28px', borderRadius:12, background:GREEN, color:'#06120a', fontWeight:700, fontSize:15, border:'none', cursor:saving?'wait':'pointer', boxShadow:'0 12px 28px -10px rgba(74,222,128,0.6)', display:'inline-flex', alignItems:'center', gap:10, opacity:saving?0.75:1 }}
        >
          {saving ? <><Spinner dark /> {tr.saving}</> : step === total-1 ? tr.finish : tr.next}
          {!saving && <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>}
        </button>
      </div>
    </Frame>
  );
}

const ActionCard = ({ tone, icon, meta, metaLabel, title, desc, cta, onAction, loading }) => {
  const c = COLORS[tone];
  return (
    <article style={{ position:'relative', overflow:'hidden', borderRadius:22, ...glass, padding:'24px 26px 22px', display:'flex', flexDirection:'column', gap:14, transition:'transform .2s, box-shadow .2s' }}
      onMouseEnter={e => { e.currentTarget.style.transform='translateY(-3px)'; e.currentTarget.style.boxShadow='0 16px 48px -16px rgba(0,0,0,0.5)'; }}
      onMouseLeave={e => { e.currentTarget.style.transform=''; e.currentTarget.style.boxShadow=''; }}
    >
      <div style={{ position:'absolute', inset:0, pointerEvents:'none', background:`radial-gradient(380px 180px at 100% 0%, ${c.glow}, transparent 70%)` }}/>
      <div style={{ position:'absolute', left:0, right:0, bottom:0, height:1, background:`linear-gradient(90deg, transparent, ${c.tone}, transparent)`, opacity:.35 }}/>
      <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', position:'relative' }}>
        <div style={{ width:54, height:54, borderRadius:15, background:c.soft, border:`1px solid ${c.border}`, color:c.tone, display:'grid', placeItems:'center', boxShadow:`0 12px 30px -14px ${c.tone}` }}>{icon}</div>
        <div style={{ textAlign:'right', fontSize:11.5, color:'#6b7180', fontWeight:500, lineHeight:1.5 }}>
          <b style={{ display:'block', color:'#ecedf0', fontSize:18, fontWeight:700, letterSpacing:'-.01em' }}>{meta}</b>
          {metaLabel}
        </div>
      </div>
      <h3 style={{ fontSize:21, fontWeight:700, letterSpacing:'-.015em', margin:'4px 0 0', lineHeight:1.2 }}>{title}</h3>
      <p style={{ margin:0, color:'#a8aebb', fontSize:14.5, lineHeight:1.5 }}>{desc}</p>
      <button
        onClick={onAction}
        disabled={loading}
        style={{ marginTop:'auto', alignSelf:'flex-start', display:'inline-flex', alignItems:'center', gap:10, padding:'12px 18px', borderRadius:12, fontSize:14.5, fontWeight:700, cursor:loading?'wait':'pointer', background:GREEN, color:'#06120a', border:'none', boxShadow:'0 10px 26px -10px rgba(74,222,128,0.6)', transition:'transform .15s, opacity .15s', opacity:loading?0.75:1 }}
        onMouseEnter={e => { if (!loading) e.currentTarget.style.transform='translateY(-1px)'; }}
        onMouseLeave={e => { e.currentTarget.style.transform=''; }}
      >
        {loading ? <Spinner dark /> : cta}
        {!loading && <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>}
      </button>
    </article>
  );
};

function Dashboard({ profile = {}, lang = 'nl', setLang, onProfileClick }) {
  const tr = T[lang];
  const displayName = profile.name || 'daar';
  const words = displayName.trim().split(/\s+/);
  const initials = (words.length >= 2 ? words[0][0] + words[words.length-1][0] : displayName.slice(0,2)).toUpperCase();
  const firstName = words[0];

  const hour = new Date().getHours();
  const greeting = tr.greet(hour);

  const [bannerVisible, setBannerVisible] = useState(true);
  const [loadingTask, setLoadingTask] = useState(null);
  const [msg, setMsg] = useState('');
  const [messages, setMessages] = useState([
    { side:'ai', text: tr.welcome(profile.name ? firstName : '') },
  ]);
  const chatRef = useRef(null);

  useEffect(() => {
    if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
  }, [messages, loadingTask]);

  const runTask = async (task, ctaKey) => {
    if (loadingTask) return;
    setMessages(m => [...m, { side:'me', text: task }]);
    setLoadingTask(ctaKey);
    try {
      const result = await callOrchestrator(task);
      setMessages(m => [...m, { side:'ai', text: result }]);
    } catch (e) {
      setMessages(m => [...m, { side:'ai', text: friendlyError(e.message), error: true }]);
    } finally {
      setLoadingTask(null);
    }
  };

  const send = () => {
    const text = msg.trim();
    if (!text || loadingTask) return;
    setMsg('');
    runTask(text, 'chat');
  };

  const cardTasks = [
    'Zoek nieuwe leads',
    'Lees mijn emails',
    'Maak een nieuwe offerte',
    'Toon mijn taken',
  ];
  const cardIcons = [
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><circle cx="11" cy="11" r="2.5" fill="currentColor" opacity=".25"/></svg>,
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 7l9 6 9-6"/></svg>,
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 14h6M9 17h4"/></svg>,
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
  ];
  const cardMeta = [
    { meta:'14', metaLabel: lang==='fr' ? 'nouveaux cette semaine' : 'nieuwe deze week', tone:'green' },
    { meta:'23', metaLabel: lang==='fr' ? 'sans réponse' : 'onbeantwoord',              tone:'blue' },
    { meta:'3',  metaLabel: lang==='fr' ? 'prêts à envoyer' : 'klaar voor verzending',  tone:'orange' },
    { meta:'7',  metaLabel: lang==='fr' ? 'sur votre liste' : 'op je lijstje',           tone:'purple' },
  ];
  const cards = tr.cards.map((c, i) => ({ ...c, ...cardMeta[i], task: cardTasks[i], icon: cardIcons[i] }));

  return (
    <Frame>
      <TopBar profile={profile} lang={lang} setLang={setLang} onProfileClick={onProfileClick} />

      {bannerVisible && (
        <div style={{ padding:'0 32px' }}>
          <div style={{ display:'flex', alignItems:'center', gap:14, padding:'14px 20px', borderRadius:14, border:'1px solid rgba(74,222,128,0.22)', background:'linear-gradient(90deg, rgba(74,222,128,0.10), rgba(74,222,128,0.02))' }}>
            <span style={{ width:34, height:34, borderRadius:10, background:'rgba(74,222,128,0.18)', display:'grid', placeItems:'center', color:GREEN, flexShrink:0 }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M5 12l5 5L20 7"/></svg>
            </span>
            <div style={{ flex:1, fontSize:15, color:'#ecedf0', lineHeight:1.45 }}>
              {lang === 'fr'
                ? <>Hier, Axon a répondu à <b style={{ color:GREEN }}>3 emails</b> et trouvé <b style={{ color:GREEN }}>5 prospects</b>.</>
                : <>Axon heeft gisteren <b style={{ color:GREEN }}>3 emails beantwoord</b> en <b style={{ color:GREEN }}>5 leads gevonden</b>.</>}
              <span style={{ color:'#a8aebb' }}> {tr.bannerQ}</span>
            </div>
            <button style={{ padding:'8px 14px', borderRadius:10, border:'1px solid rgba(74,222,128,0.3)', background:'rgba(74,222,128,0.08)', color:GREEN, fontSize:13, fontWeight:600, cursor:'pointer' }}>{tr.bannerBtn}</button>
            <button onClick={() => setBannerVisible(false)} style={{ width:30, height:30, borderRadius:8, border:'none', background:'transparent', color:'#6b7180', cursor:'pointer', fontSize:16 }}>✕</button>
          </div>
        </div>
      )}

      <div style={{ padding:'24px 32px 12px' }}>
        <h1 style={{ fontSize:34, fontWeight:700, letterSpacing:'-0.02em', margin:'8px 0 6px', lineHeight:1.1 }}>
          {greeting}, {firstName}. <span style={{ color:GREEN }}>{tr.headline}</span>
        </h1>
        <p style={{ margin:0, fontSize:15.5, color:'#a8aebb' }}>{tr.subtitle}</p>
      </div>

      <div style={{ padding:'8px 32px 0', display:'grid', gridTemplateColumns:'1fr 1fr', gap:18 }}>
        {cards.map(c => (
          <ActionCard key={c.cta} {...c}
            onAction={() => runTask(c.task, c.cta)}
            loading={loadingTask === c.cta}
          />
        ))}
      </div>

      {/* Chat */}
      <div style={{ padding:'24px 32px 40px' }}>
        <div style={{ borderRadius:22, ...glass, overflow:'hidden' }}>
          <div style={{ padding:'16px 22px', borderBottom:'1px solid rgba(255,255,255,0.06)', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <div style={{ display:'flex', alignItems:'center', gap:12 }}>
              <h2 style={{ margin:0, fontSize:17, fontWeight:700 }}>{tr.chatTitle}</h2>
              <span style={{ display:'inline-flex', alignItems:'center', gap:7, fontSize:12.5, color: loadingTask ? '#fb923c' : GREEN, fontWeight:600, padding:'4px 10px', borderRadius:999, background: loadingTask ? 'rgba(251,146,60,0.12)' : 'rgba(74,222,128,0.14)' }}>
                <span style={{ width:7, height:7, borderRadius:'50%', background: loadingTask ? '#fb923c' : GREEN }}/> {loadingTask ? tr.chatBusy : tr.chatOnline}
              </span>
            </div>
          </div>

          <div ref={chatRef} style={{ padding:'20px 24px', display:'flex', flexDirection:'column', gap:14, maxHeight:340, overflowY:'auto' }}>
            {messages.map((m, i) => (
              <Bubble key={i} side={m.side} error={m.error} initials={initials}>{m.text}</Bubble>
            ))}
            {loadingTask && <ThinkingBubble text={tr.thinking} />}
          </div>

          <div style={{ padding:'14px 22px 18px', borderTop:'1px solid rgba(255,255,255,0.06)' }}>
            <div style={{ display:'flex', alignItems:'center', gap:12, padding:'6px 6px 6px 22px', borderRadius:14, border:'1px solid rgba(255,255,255,0.12)', background:'#0c0e15' }}>
              <span style={{ color:'#6b7180', fontSize:18 }}>›</span>
              <input
                placeholder={tr.chatPlaceholder}
                value={msg}
                onChange={e => setMsg(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && send()}
                disabled={!!loadingTask}
                style={{ flex:1, padding:'14px 0', background:'transparent', border:'none', outline:'none', color:'#ecedf0', fontSize:16, opacity: loadingTask ? 0.5 : 1 }}
              />
              <button
                onClick={send}
                disabled={!!loadingTask || !msg.trim()}
                style={{ height:46, padding:'0 22px', borderRadius:12, background:GREEN, color:'#06120a', border:'none', fontWeight:700, fontSize:14.5, cursor: (loadingTask || !msg.trim()) ? 'not-allowed' : 'pointer', display:'inline-flex', alignItems:'center', gap:8, boxShadow:'0 12px 28px -10px rgba(74,222,128,0.6)', opacity: (loadingTask || !msg.trim()) ? 0.6 : 1, transition:'opacity .15s' }}
              >
                {loadingTask === 'chat' ? <Spinner dark /> : tr.chatSend}
                {loadingTask !== 'chat' && <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>}
              </button>
            </div>
            <p style={{ marginTop:10, fontSize:12, color:'#6b7180' }}>
              {tr.chatHints}
            </p>
          </div>
        </div>
      </div>
    </Frame>
  );
}

/* ═══════════════════════════════════════════════════
   SCREEN 3 — WEEKLY REPORT

function Report({ profile = {}, lang = 'nl', setLang, onProfileClick }) {
  const tr = T[lang];
  const [loading, setLoading] = useState(false);
  const [resultMsg, setResultMsg] = useState(null);
  const [stats, setStats] = useState(null);

  useEffect(() => {
    fetch('/api/stats').then(r => r.json()).then(setStats).catch(() => {});
  }, []);

  const handleDownload = async () => {
    setLoading(true);
    setResultMsg(null);
    try {
      const result = await callOrchestrator('Maak een weekrapport als PDF');
      setResultMsg({ ok: true, text: result });
    } catch (e) {
      setResultMsg({ ok: false, text: e.message });
    } finally {
      setLoading(false);
    }
  };

  return (
    <Frame>
      <TopBar profile={profile} lang={lang} setLang={setLang} onProfileClick={onProfileClick} />
      <div style={{ padding:'0 40px 60px', maxWidth:960, margin:'0 auto' }}>
        <div style={{ padding:'8px 0 28px', borderBottom:'1px solid rgba(255,255,255,0.06)' }}>
          <span style={{ display:'inline-flex', gap:8, alignItems:'center', fontSize:12, fontWeight:700, color:GREEN, letterSpacing:'.06em', padding:'6px 12px', border:'1px solid rgba(74,222,128,0.25)', borderRadius:999, background:'rgba(74,222,128,0.06)' }}>
            ● Weekrapport · KW 19 · 5–9 mei 2026
          </span>
          <h1 style={{ margin:'18px 0 8px', fontSize:40, fontWeight:700, letterSpacing:'-0.02em', lineHeight:1.1 }}>{tr.reportTitle.split('\n').map((l,i) => <span key={i}>{l}{i===0&&<br/>}</span>)}</h1>
          <p style={{ margin:0, fontSize:16.5, color:'#a8aebb', lineHeight:1.55, maxWidth:640 }}>{tr.reportSub}</p>
        </div>

        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:14, marginTop:24 }}>
          {[
            { n: stats ? stats.leads : '—', l: tr.reportStats[0], s: stats ? `${stats.leads} ${tr.reportTotalSuffix}` : (lang==='fr'?'chargement…':'wordt geladen…') },
            { n: stats ? stats.tasks : '—', l: tr.reportStats[1], s: stats ? `${stats.tasks}` : (lang==='fr'?'chargement…':'wordt geladen…') },
            { n: stats ? stats.docs  : '—', l: tr.reportStats[2], s: stats ? `${stats.docs}` : (lang==='fr'?'chargement…':'wordt geladen…') },
          ].map((s,i) => (
            <div key={i} style={{ padding:'22px 22px 18px', borderRadius:18, ...glass }}>
              <div style={{ fontSize:13, color:'#a8aebb', fontWeight:600 }}>{s.l}</div>
              <div style={{ fontSize:52, fontWeight:700, letterSpacing:'-0.03em', lineHeight:1, marginTop:8, color:GREEN }}>{s.n}</div>
              <div style={{ fontSize:12.5, color:'#6b7180', marginTop:6, fontFamily:"'JetBrains Mono',monospace" }}>{s.s}</div>
            </div>
          ))}
        </div>

        <div style={{ marginTop:32, padding:'28px 30px', borderRadius:20, border:'1px solid rgba(255,255,255,0.06)', background:'rgba(255,255,255,0.018)' }}>
          <h2 style={{ margin:'0 0 14px', fontSize:20, fontWeight:700, letterSpacing:'-.01em' }}>{tr.reportNarrativeTitle}</h2>
          <p style={{ margin:'0 0 14px', fontSize:16.5, color:'#cfd2da', lineHeight:1.7 }}>
            Beste Lucas, deze week is rustig maar productief geweest. Ik heb <b style={{ color:GREEN }}>14 nieuwe contacten</b> gevonden in West-Vlaanderen die goed bij je proefkamer-aanbod passen — vooral bouwbedrijven en horeca die nog niet bij je kopen. Drie ervan hebben al positief geantwoord.
          </p>
          <p style={{ margin:'0 0 14px', fontSize:16.5, color:'#cfd2da', lineHeight:1.7 }}>
            Verder heb ik <b style={{ color:GREEN }}>42 mails afgehandeld</b> in jouw plaats — meestal vragen over leveringen en proeverijen. Niets dringends bleef liggen. Je hebt nog <b>één mail</b> openstaan die echt jouw stem nodig heeft (van Vandeputte Bouwgroep — staat klaar in je inbox).
          </p>
          <p style={{ margin:0, fontSize:16.5, color:'#cfd2da', lineHeight:1.7 }}>
            Tot slot heb ik <b style={{ color:GREEN }}>5 offertes</b> opgesteld op basis van je gewone sjabloon, en <b>3 vriendelijke herinneringen</b> gestuurd voor openstaande facturen. Volgende week stel ik voor om de proeverij van 22 mei in te plannen — dat staat al op je lijstje.
          </p>
        </div>

        <div style={{ marginTop:20, display:'grid', gridTemplateColumns:'1fr 1fr', gap:14 }}>
          <div style={{ padding:'18px 20px', borderRadius:14, border:'1px solid rgba(74,222,128,0.22)', background:'linear-gradient(90deg, rgba(74,222,128,0.10), rgba(74,222,128,0.02))' }}>
            <div style={{ fontSize:11.5, color:GREEN, fontFamily:"'JetBrains Mono',monospace", letterSpacing:'.12em', textTransform:'uppercase', fontWeight:600 }}>{tr.reportHighlight}</div>
            <div style={{ fontSize:15.5, color:'#ecedf0', marginTop:8, lineHeight:1.5 }}>Sofie Dewulf antwoordde binnen 12 minuten. <b style={{ color:GREEN }}>Eerste deal in zicht.</b></div>
          </div>
          <div style={{ padding:'18px 20px', borderRadius:14, border:'1px solid rgba(255,255,255,0.07)', background:'rgba(255,255,255,0.02)' }}>
            <div style={{ fontSize:11.5, color:'#a8aebb', fontFamily:"'JetBrains Mono',monospace", letterSpacing:'.12em', textTransform:'uppercase', fontWeight:600 }}>{tr.reportNeeds}</div>
            <div style={{ fontSize:15.5, color:'#ecedf0', marginTop:8, lineHeight:1.5 }}>1 mail van Vandeputte — kan ik niet alleen beantwoorden, ze willen je horen.</div>
          </div>
        </div>

        {/* Download CTA */}
        <div style={{ marginTop:28, display:'flex', flexDirection:'column', gap:14, padding:'22px 26px', borderRadius:18, ...glass }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:18 }}>
            <div>
              <div style={{ fontSize:17, fontWeight:700 }}>{tr.reportSaveTitle}</div>
              <div style={{ fontSize:14, color:'#a8aebb', marginTop:4 }}>{tr.reportSaveDesc}</div>
            </div>
            <button
              onClick={handleDownload}
              disabled={loading}
              style={{ padding:'16px 26px', borderRadius:14, background:GREEN, color:'#06120a', border:'none', fontWeight:700, fontSize:16, cursor:loading?'wait':'pointer', display:'inline-flex', alignItems:'center', gap:10, boxShadow:'0 14px 32px -10px rgba(74,222,128,0.6)', opacity:loading?0.75:1, transition:'opacity .15s', flexShrink:0 }}
            >
              {loading ? <><Spinner dark /> {lang==='fr'?'En cours…':'Bezig…'}</> : <><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> {tr.downloadPdf}</>}
            </button>
          </div>
          {resultMsg && (
            <div style={{ padding:'14px 18px', borderRadius:12, background: resultMsg.ok ? 'rgba(74,222,128,0.08)' : 'rgba(251,146,60,0.08)', border:`1px solid ${resultMsg.ok ? 'rgba(74,222,128,0.25)' : 'rgba(251,146,60,0.25)'}`, fontSize:13.5, color: resultMsg.ok ? '#a8f0bc' : '#fbcfaa', lineHeight:1.6, whiteSpace:'pre-wrap', animation:'fadeIn .3s ease' }}>
              {resultMsg.text}
            </div>
          )}
        </div>
      </div>
    </Frame>
  );
}

/* ═══════════════════════════════════════════════════
   ROOT APP — tab nav
═══════════════════════════════════════════════════ */
const TABS = [
  { id:'onboarding', label:'01 · Onboarding',  Screen: Onboarding },
  { id:'dashboard',  label:'02 · Dashboard',    Screen: Dashboard  },
  { id:'rapport',    label:'03 · Weekrapport',  Screen: Report     },
];

function App() {
  const [active, setActive] = useState('dashboard');
  const [profile, setProfile] = useState({});
  const [lang, setLang] = useState('nl');

  useEffect(() => {
    fetch('/api/profile').then(r => r.json()).then(p => { if (p && p.name) setProfile(p); }).catch(() => {});
  }, []);

  const handleOnboardingComplete = (profileData) => {
    setProfile(profileData);
    setActive('dashboard');
  };

  const { Screen } = TABS.find(t => t.id === active);
  const screenProps = {
    profile,
    lang,
    setLang,
    onComplete: handleOnboardingComplete,
    onProfileClick: () => setActive('onboarding'),
  };

  return (
    <>
      <nav className="screen-nav">
        <span className="screen-nav-logo">AXON</span>
        <div className="screen-tabs">
          {TABS.map(t => (
            <button key={t.id} className={`screen-tab ${active === t.id ? 'active' : ''}`} onClick={() => setActive(t.id)}>{t.label}</button>
          ))}
        </div>
      </nav>
      <div className="screen-content"><Screen {...screenProps} /></div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
